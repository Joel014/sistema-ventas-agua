<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - AWA</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card:active {
            transform: scale(0.98);
            background: #334155;
        }

        .icon {
            font-size: 24px;
            margin-bottom: 10px;
            display: inline-block;
            padding: 10px;
            border-radius: 12px;
        }

        h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="window.location.href='index.html'">
        <i class="bi bi-arrow-left"></i> Volver a Inicio
    </button>

    <h1 style="margin-top: 20px;">Menú Principal</h1>

    <div class="grid">
        <div class="card" onclick="startSection('planta')">
            <div class="icon" style="background:rgba(59,130,246,0.1); color:#3b82f6;"><i class="bi bi-shop"></i></div>
            <h3>Planta</h3>
        </div>
        <div class="card" onclick="startSection('camion')">
            <div class="icon" style="background:rgba(16,185,129,0.1); color:#10b981;"><i class="bi bi-truck"></i></div>
            <h3>Camión</h3>
        </div>
        <div class="card" onclick="startSection('gastos')">
            <div class="icon" style="background:rgba(245,158,11,0.1); color:#f59e0b;"><i class="bi bi-wallet2"></i>
            </div>
            <h3>Gastos</h3>
        </div>
        <div class="card" onclick="startSection('produccion')">
            <div class="icon" style="background:rgba(139,92,246,0.1); color:#8b5cf6;"><i
                    class="bi bi-bar-chart-steps"></i></div>
            <h3>Producción</h3>
        </div>
        <div class="card" onclick="startSection('config')">
            <div class="icon" style="background:rgba(107,114,128,0.1); color:#6b7280;"><i class="bi bi-gear"></i></div>
            <h3>Config</h3>
        </div>
        <div class="card"
            onclick="localStorage.removeItem('userEmail'); localStorage.removeItem('userRole'); window.location.href='index.html';">
            <div class="icon" style="background:rgba(239,68,68,0.1); color:#ef4444;"><i
                    class="bi bi-box-arrow-right"></i></div>
            <h3 style="color:#ef4444">Salir</h3>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px; font-size: 12px; opacity: 0.5;">
        <i class="bi bi-arrow-right"></i> Desliza a la derecha para volver
    </div>

    <script>
        function startSection(section) {
            localStorage.setItem('activeView', section);
            // Small delay to ensure storage write
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 50);
        }

        // SWIPE GESTURE SUPPORT
        let touchStartX = 0;
        let touchEndX = 0;

        document.body.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.body.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            // Swipe Right (Back)
            if (touchEndX > touchStartX + 100) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
